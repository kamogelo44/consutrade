<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="test.css">
    <title>Test Components - Registration Modal</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            background-color: #ffffff;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Close Button */
        .btn-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .btn-close img {
            width: 20px;
            height: 20px;
            filter: brightness(0) invert(0.5);
        }

        .btn-close:hover img {
            filter: brightness(0) invert(0.3);
        }

        /* Modal Header */
        .modal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .modal-header h1 {
            font-size: 28px;
            font-weight: bold;
            color: #1A1A1A;
            margin-bottom: 8px;
        }

        .modal-header h1 span {
            color: #FF6B00;
        }

        .modal-header p {
            font-size: 14px;
            color: #666666;
        }

        /* Form Styles */
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Fieldset Styles */
        .form-fields,
        .user-type {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin: 0;
        }

        .form-fields legend,
        .user-type legend {
            font-weight: bold;
            color: #333333;
            padding: 0 10px;
            font-size: 16px;
        }

        /* Input Groups */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333333;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: #FF6B00;
        }

        /* Radio Buttons */
        .radio-buttons {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #333333;
        }

        .radio-label input[type="radio"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #FF6B00;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #e05f00;
        }

        /* Login Link */
        .login-link {
            text-align: center;
            font-size: 14px;
            color: #666666;
            margin: 10px 0 0 0;
        }

        .login-link a {
            color: #FF6B00;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .modal-content {
                width: 95%;
                padding: 20px;
            }
            
            .modal-header h1 {
                font-size: 24px;
            }
            
            .form-fields,
            .user-type {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .modal-content {
                padding: 20px 15px;
            }
            
            .radio-buttons {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Registration Modal -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <button type="button" class="btn-close">
                <img src="images/icons/form-close-svgrepo-com.svg" width="24px" height="24px" alt="Close form">
            </button>
            
            <div class="modal-header">
                <h1>Consu<span>Trade</span></h1>
                <p>Join thousands of South African traders</p>
            </div>
            
            <form action="" method="post" class="register-form">
                <fieldset class="form-fields">
                    <legend>Create Account</legend>
                    
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name..." required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create password" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm_password" placeholder="Repeat your password" required>
                    </div>
                </fieldset>
                
                <fieldset class="user-type">
                    <legend>I want to:</legend>
                    <div class="radio-buttons">
                        <input type="radio" id="buy" name="user_type" value="buyer" checked>
                        <label for="buy" class="radio-btn radio">
                            <img src="images/icons/buy-cash-finance-svgrepo-com.svg" width="20px" height="20px" alt="Buy icon">
                            Buy Products
                        </label>
                        
                        <input type="radio" id="sell" name="user_type" value="seller">
                        <label for="sell" class="radio-btn radio">
                            <img src="images/icons/sell-svgrepo-com.svg" width="20px" height="20px" alt="Sell icon">
                            Sell Products
                        </label>
                    </div>
                </fieldset>
                
                <button type="submit" class="submit-btn">Create Account</button>
                
                <p class="login-link">Already have an account? <a href="#">Login</a></p>
            </form>
        </div>
    </div>

    <!-- Temporary button to test modal -->
    <button id="test-modal-btn" style="position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; background-color: #FF6B00; color: white; border: none; border-radius: 8px; cursor: pointer; z-index: 999; font-size: 16px; font-weight: bold;">
        Open Registration Form
    </button>

    <script>
        // JavaScript for modal functionality
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('register-modal');
            const testBtn = document.getElementById('test-modal-btn');
            const closeBtn = document.querySelector('.btn-close');
            
            // Open modal when clicking test button
            if (testBtn) {
                testBtn.addEventListener('click', function() {
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden'; // Prevent scrolling
                });
            }
            
            // Close modal when clicking close button
            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    modal.classList.remove('active');
                    document.body.style.overflow = ''; // Restore scrolling
                });
            }
            
            // Close modal when clicking outside modal content
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        modal.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                });
            }
            
            // Optional: Handle form submission (prevent default for testing)
            const form = document.querySelector('.register-form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    alert('Form submitted! (This is just a test)');
                    // You can add actual form submission logic here
                });
            }
        });
    </script>
</body>
</html>
